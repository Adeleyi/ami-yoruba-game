<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Àmì — Yorùbá tone game</title>
<!--
  Àmì — Yorùbá tone learning game (static web app).

  This is the plain, framework-free version of the game: just index.html plus
  questions.json and families.json. It runs in any browser and can be hosted for
  free on Vercel, Netlify, or GitHub Pages — no server, no database, no cost.

  Content lives in the two JSON files (edit those, not this file):
    questions.json : sentence-level fill-in-the-blank items.
    families.json  : vetted minimal-pair word families. The game GENERATES the
                     Monosyllable / Bisyllable / Trisyllable rounds from these.

  Progress (coins, best score, rank) is stored in the browser's localStorage.

  To run locally:  python3 -m http.server  then open http://localhost:8000
-->
<style>
:root{--indigo:#1d2b53;--indigo2:#2c3e6b;--gold:#c8902a;--paper:#faf7f2;
--good:#2e7d5b;--bad:#b23a48;--ink:#222838;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:680px;margin:0 auto;padding:24px 18px 70px;}
button{font-family:inherit;cursor:pointer;}
.btn{width:100%;border:1px solid var(--indigo);background:var(--indigo);color:#fff;
font-weight:700;border-radius:10px;padding:13px;font-size:1rem;margin-top:10px;}
.btn:hover{background:var(--indigo2);}
.btn.ghost{background:#fff;color:var(--indigo);}
.btn.gold{background:var(--gold);border-color:var(--gold);}
.btn:disabled{opacity:.45;cursor:default;}
.row{display:flex;gap:10px;}
.home{text-align:center;margin:2.4rem 0 1.2rem;}
.title{color:var(--indigo);font-weight:800;font-size:4.2rem;line-height:1;letter-spacing:-1px;margin:0;}
.marks{font-size:2.8rem;letter-spacing:.65rem;color:var(--indigo);margin:.5rem 0 0;}
.marks b{color:var(--gold);}
.h2{color:var(--indigo);font-weight:800;font-size:1.7rem;margin:.2rem 0 .7rem;}
.lead{color:#555;margin:0 0 8px;}
.meta{display:flex;justify-content:space-between;color:#6b7280;font-size:.85rem;margin:14px 0 6px;}
.bar{height:6px;background:#eadfce;border-radius:6px;overflow:hidden;margin-bottom:14px;}
.bar>i{display:block;height:100%;background:var(--gold);transition:width .3s;}
.sentence{background:#fff;border:1px solid #ece5d8;border-left:5px solid var(--gold);
border-radius:10px;padding:18px 20px;font-size:1.5rem;margin:.2rem 0;}
.hint{color:#6b7280;font-size:1.02rem;margin:8px 2px 16px;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:#fff;border:2px solid #e6ded0;border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;}
.card:hover{border-color:var(--indigo);}
.card.good{border-color:var(--good);background:#eaf5ef;}
.card.bad{border-color:var(--bad);background:#fbeef0;}
.card.lock{cursor:default;}
.word{font-size:2rem;font-weight:800;color:var(--indigo);}
.mean{color:#6b7280;font-size:.92rem;margin-top:4px;min-height:1.1em;}
.promptcard{background:#fff;border:1px solid #ece5d8;border-radius:10px;padding:22px 18px;text-align:center;margin:.2rem 0 6px;}
.promptbare{font-size:1.05rem;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;}
.promptgloss{font-size:1.7rem;font-weight:800;color:var(--indigo);margin-top:4px;}
.promptclass{color:#a8471f;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
.hintnote{color:#6b7280;font-size:.9rem;margin-top:10px;}
.feed{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:1.02rem;}
.feed.good{background:#eaf5ef;border-left:5px solid var(--good);color:#1c5a40;}
.feed.bad{background:#fbeef0;border-left:5px solid var(--bad);color:#7c2531;}
.feed.sandhi{background:#fbf3e3;border-left:5px solid var(--gold);color:#6b4f13;margin-top:10px;}
.fcard{background:#fff;border:1px solid #ece5d8;border-radius:10px;padding:12px 16px;margin-bottom:10px;position:relative;}
.fam{font-weight:800;color:var(--gold);font-size:1.15rem;}
.badge{display:inline-block;background:#fbf3e3;color:#8a6a1a;border:1px solid #e9d3a0;
border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;margin-left:8px;vertical-align:middle;}
.muted{color:#6b7280;}
.lesson{background:#fff;border:1px solid #ece5d8;border-radius:10px;padding:6px 20px;line-height:1.6;}
.lesson li{margin:6px 0;}
.stats{display:flex;gap:8px;justify-content:center;margin:12px 0 2px;flex-wrap:wrap;}
.chip{background:#fff;border:1px solid #ece5d8;border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--indigo);font-weight:700;}
.chip b{color:var(--gold);}
.audio{background:#fff;border:1px solid var(--gold);color:var(--gold);border-radius:999px;
padding:4px 12px;font-size:.9rem;font-weight:700;margin:6px 0 0;}
.rankup{background:#fbf3e3;border:1px solid #e9d3a0;border-radius:10px;padding:12px 16px;color:#6b4f13;margin-top:10px;text-align:center;font-weight:700;}
.soon{opacity:.55;}
.lkinput{width:100%;border:1px solid #e6ded0;border-radius:10px;padding:12px 14px;font-size:1.15rem;margin:6px 0 12px;}
.lkinput:focus{outline:none;border-color:var(--indigo);}
</style></head><body><div class="wrap"><div id="app">Loading…</div></div>
<script>
// ---- config (edit these) ---------------------------------------------------
const NAME="Àmì", ROUND=10, PTS=10, HINTS=3;
// ---- data (loaded from the JSON files at startup) --------------------------
let QUESTIONS=[], FAMILIES=[], WORDITEMS=[], SENTENCE_ITEMS=[], LOOKUP=[], AUDIO={};

const MSG={
perfect:["Perfect round. You read every tone correctly. You are a champion.","Flawless, ten out of ten. Your ear for tone is excellent.","A clean sweep. Every single answer was right."],
strong:["Very strong. Just a little more for a perfect score.","Excellent work. You missed only a few.","Almost perfect. Your tone reading is sharp."],
middle:["Good work. You are getting the hang of the tones.","Solid round. Keep practising and the score will climb.","Nicely done. A few more rounds will sharpen it."],
low:["You are getting there. Try another round.","A fair start. Visit Learn, then play again.","Keep going. Each round will make the tones clearer."],
vlow:["Do not worry, tones take practice. Visit Learn, then try again.","Tone is tricky at first. Spend a moment in Learn and come back.","A tough round. The Learn section will help, then give it another go."]};

// Rank names are tone-themed and PENDING NATIVE-SPEAKER REVIEW. Edit freely.
const RANKS=[
 {min:0,   name:"Ìbẹ̀rẹ̀",     gloss:"Beginner"},
 {min:10,  name:"Ohùn Ìsàlẹ̀", gloss:"Low tone"},
 {min:25,  name:"Ohùn Àárín",  gloss:"Mid tone"},
 {min:50,  name:"Ohùn Òkè",    gloss:"High tone"},
 {min:100, name:"Ọ̀gá Àmì",    gloss:"Tone master"}];
function rankFor(c){let r=RANKS[0];for(const x of RANKS){if(c>=x.min)r=x;}return r;}

// ---- persistent progress (browser localStorage; no server, no cost) --------
function loadP(){try{return JSON.parse(localStorage.getItem("ami")||"{}");}catch(e){return {};}}
function saveP(){try{localStorage.setItem("ami",JSON.stringify(P));}catch(e){}}
let P=loadP();
if(P.coins===undefined){P.coins=3;P.best=0;P.played=0;saveP();} // free starter coins

// ---- helpers ---------------------------------------------------------------
const app=()=>document.getElementById("app");
const pickOne=a=>a[Math.random()*a.length|0];
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]];}return a;}
function sample(a,n){return shuffle([...a]).slice(0,n);}
function sylCount(key){return (key.match(/[aeiou]/g)||[]).length;}
function levelOf(n){return n<=1?"mono":n===2?"bi":"tri";}
// strip tone marks AND the subdot so "oko" matches "ọkọ̀", "ẹ̀kọ́", etc.
function bare(s){return s.normalize("NFD").replace(/[̣̀́]/g,"").toLowerCase();}

// ---- build playable items from the loaded data -----------------------------
function buildData(){
 WORDITEMS=[];
 FAMILIES.forEach(f=>{
  if(!f.members||f.members.length<2)return;
  const lv=levelOf(sylCount(f.key));
  f.members.forEach(m=>{
   let others=shuffle(f.members.filter(x=>x.word!==m.word)).slice(0,3);
   WORDITEMS.push({kind:"word",level:lv,famKey:f.key,bare:f.key,prompt:m.meaning,
     options:[m,...others].map(o=>({word:o.word,meaning:o.meaning})),
     correctWord:m.word,
     explanation:`<b>${m.word}</b> means “${m.meaning}”.`+
       (others.length?` The look-alikes: `+others.map(o=>`<b>${o.word}</b> (“${o.meaning}”)`).join(", ")+".":"")});
  });
 });
 SENTENCE_ITEMS=QUESTIONS.map(q=>({kind:"sentence",level:"sentence",id:q.id,
  sentence:q.sentence,translation:q.translation,
  options:[{word:q.A.word,meaning:q.A.meaning},{word:q.B.word,meaning:q.B.meaning}],
  correctWord:q[q.correct].word,explanation:q.explanation,
  sandhi_note:q.sandhi_note,audio:q.audio}));
 LOOKUP=[];
 FAMILIES.forEach(f=>f.members.forEach(m=>LOOKUP.push({word:m.word,meaning:m.meaning,key:f.key,b:bare(m.word)})));
}

function poolFor(mode){
 // learner levels map to the linguistic content behind the scenes
 if(mode==="beginner")return WORDITEMS.filter(w=>w.level==="mono");
 if(mode==="intermediate")return WORDITEMS.filter(w=>w.level==="bi"||w.level==="tri");
 if(mode==="advanced")return SENTENCE_ITEMS;
 if(mode==="mixed")return WORDITEMS.concat(SENTENCE_ITEMS);
 if(mode==="sentence")return SENTENCE_ITEMS;
 return WORDITEMS.filter(w=>w.level===mode);
}

// ---- round state -----------------------------------------------------------
let rd=[],i=0,points=0,streak=0,hintsLeft=HINTS,coinsRound=0,coinsAtStart=0,curMode="mono",peek=false;

function newRound(mode){
 curMode=mode;const pool=poolFor(mode);
 if(pool.length===0){levelMenu();return;}
 rd=sample(pool,Math.min(ROUND,pool.length));
 rd.forEach(q=>{q._opts=shuffle([...q.options]);q._answered=false;q._picked=null;q._hint=false;});
 i=0;points=0;streak=0;hintsLeft=HINTS;coinsRound=0;coinsAtStart=P.coins;peek=false;play();}

function play(){
 if(peek){return renderFamilies(true);}
 const q=rd[i],N=rd.length;
 const show=q._hint||q._answered, allAns=rd.every(x=>x._answered);
 function card(o){let c="card";
  if(q._answered){c+=" lock";if(o.word===q.correctWord)c+=" good";else if(o.word===q._picked)c+=" bad";}
  return `<div class="${c}" data-w="${o.word}"><div class="word">${o.word}</div><div class="mean">${show?o.meaning:""}</div></div>`;}
 let promptHtml;
 if(q.kind==="sentence"){
  promptHtml=`<div class="sentence">${q.sentence}</div><div class="hint">💬 ${q.translation}</div>`;
 }else{
  promptHtml=`<div class="promptcard"><div class="promptbare">${q.bare}</div>
  <div class="promptgloss">${q.prompt}</div><div class="promptclass">pick the correct tone</div></div>`;
 }
 let feed="",hintArea="";
 if(q._answered){const ok=q._picked===q.correctWord;
  feed=`<div class="feed ${ok?'good':'bad'}">${ok?'✓ Correct. ':'✗ Not quite. The answer is <b>'+q.correctWord+'</b>. '}${q.explanation}</div>`;
  if(q.sandhi_note){feed+=`<div class="feed sandhi">🔁 ${q.sandhi_note}</div>`;}
 }else if(q._hint){hintArea=`<div class="hintnote">Hints left: ${hintsLeft}</div>`;}
 else{hintArea=`<button class="btn ghost" onclick="useHint()" ${hintsLeft===0?'disabled':''}>${hintsLeft===0?'No hints left':'Hint'} (${hintsLeft} left)</button>`;}
 let listen=q._opts.filter(o=>AUDIO[o.word]).map(o=>`<button class="audio" onclick="playAudio('${AUDIO[o.word]}')">🔊 ${o.word}</button>`).join(" ");
 if(q.audio)listen=`<button class="audio" onclick="playAudio('${q.audio}')">🔊 sentence</button> `+listen;
 const audio=listen?`<div style="margin:6px 0">${listen}</div>`:"";
 const nav=`<div class="row">
 <button class="btn ghost" onclick="prev()" ${i===0?'disabled':''}>← Previous</button>
 <button class="btn ghost" onclick="next()" ${i===N-1?'disabled':''}>Next →</button></div>`;
 const finish=allAns?`<button class="btn gold" onclick="results()">See your score</button>`:"";
 app().innerHTML=`
 <div class="meta"><span>Question ${i+1} of ${N} · ${points} pts · 🪙 ${P.coins}${streak?' · streak '+streak:''}</span>
 <a href="#" onclick="home();return false" class="muted">Quit</a></div>
 <div class="bar"><i style="width:${(i+1)/N*100}%"></i></div>
 ${promptHtml}
 <div class="opts">${q._opts.map(card).join("")}</div>
 ${audio}${feed}${hintArea}${nav}${finish}`;
 if(!q._answered){app().querySelectorAll(".card").forEach(c=>c.onclick=()=>choose(c.dataset.w));}
}

function choose(w){const q=rd[i];if(q._answered)return;q._answered=true;q._picked=w;
 if(w===q.correctWord){points+=PTS;streak++;coinsRound++;P.coins++;saveP();}else{streak=0;}play();}
function useHint(){const q=rd[i];if(q._hint||q._answered||hintsLeft===0)return;q._hint=true;hintsLeft--;play();}
function prev(){if(i>0){i--;play();}}
function next(){if(i<rd.length-1){i++;play();}}
function famPeek(){peek=true;play();}
function famBack(){peek=false;play();}
function playAudio(src){try{new Audio(src).play();}catch(e){}}

function results(){
 const correct=rd.filter(x=>x._answered&&x._picked===x.correctWord).length;
 const total=rd.length;
 const pct=Math.round(100*correct/total);
 P.played=(P.played||0)+1; if(pct>P.best)P.best=pct; saveP();
 const b=correct===total?"perfect":pct>=80?"strong":pct>=60?"middle":pct>=40?"low":"vlow";
 const before=rankFor(coinsAtStart), now=rankFor(P.coins);
 const rankup=(now.name!==before.name)?`<div class="rankup">🎉 New rank: <b>${now.name}</b> (${now.gloss})</div>`:"";
 app().innerHTML=`<div class="h2">Round complete</div>
 <div class="sentence">You got <b>${correct} / ${total}</b> correct &nbsp;·&nbsp; ${points} points &nbsp;·&nbsp; 🪙 +${coinsRound}
 <br><span class="muted">${pickOne(MSG[b])}</span></div>
 ${rankup}
 <button class="btn" onclick="newRound('${curMode}')">Play again</button>
 <div class="row"><button class="btn ghost" onclick="levelMenu()">Levels</button>
 <button class="btn ghost" onclick="home()">Home</button></div>`;
}

// ---- screens ---------------------------------------------------------------
function home(){peek=false;
 app().innerHTML=`
 <div class="home"><div class="title">${NAME}</div><div class="marks">à <b>a</b> á</div></div>
 <button class="btn" onclick="levelMenu()">Play</button>
 <div class="row"><button class="btn ghost" onclick="learn()">Learn</button>
 <button class="btn ghost" onclick="lookup()">Dictionary</button></div>
 <button class="btn ghost" onclick="howto()">How to play</button>`;}

function levelMenu(){peek=false;
 function lvBtn(mode,label,desc){const n=poolFor(mode).length;
  if(n===0)return `<button class="btn soon" disabled>${label} · coming soon</button>`;
  return `<button class="btn" onclick="newRound('${mode}')">${label}<br><span style="font-weight:400;font-size:.85rem;opacity:.85">${desc}</span></button>`;}
 app().innerHTML=`<div class="h2">Choose your level</div>
 <p class="lead">New to Yorùbá? Start at Beginner and work your way up.</p>
 ${lvBtn("beginner","Beginner","Single-syllable words · the three tones")}
 ${lvBtn("intermediate","Intermediate","Two-syllable words · tone & vowel quality")}
 ${lvBtn("advanced","Advanced","Full sentences · tone in real context")}
 <button class="btn gold" onclick="newRound('mixed')">Mixed practice</button>
 <button class="btn ghost" onclick="home()">← Home</button>`;}

function renderFamilies(inRound){
 let cards=FAMILIES.map(f=>{
  let rows=f.members.map(m=>`<div>• <b>${m.word}</b> <span class="muted">${m.meaning}</span></div>`).join("");
  let badge=f.type==="sandhi"?`<span class="badge">🔁 tone shift</span>`:"";
  return `<div class="fcard"><div class="fam">${f.key}${badge}</div>${rows}</div>`;}).join("");
 const back=inRound?`<button class="btn" onclick="famBack()">← Back to the question</button>`
                   :`<button class="btn ghost" onclick="learn()">← Back to Learn</button>`;
 app().innerHTML=`<div class="h2">Word families</div>
 <p class="lead">Words that share the same letters but change meaning with tone or vowel. ${inRound?"Take a look, then return to your question.":"Study these, then test yourself in Play."}</p>
 ${cards}${back}`;}
function families(){peek=false;renderFamilies(false);}

function lookup(){peek=false;
 app().innerHTML=`<div class="h2">Dictionary</div>
 <p class="lead">Type a word <b>without tone marks</b> (e.g. “oko”) to see every toned form and what each one means.</p>
 <input id="lkq" class="lkinput" placeholder="Search a word…" oninput="doSearch(this.value)" autocomplete="off">
 <div id="lkres"></div>
 <button class="btn ghost" onclick="home()">← Home</button>`;
 setTimeout(()=>{const el=document.getElementById("lkq");if(el)el.focus();},0);
 doSearch("");}
function doSearch(qraw){
 const box=document.getElementById("lkres");if(!box)return;
 const t=bare(qraw).trim();
 if(!t){box.innerHTML=`<p class="muted">Start typing to search ${LOOKUP.length} words.</p>`;return;}
 let hits=LOOKUP.filter(x=>x.b.includes(t));
 hits.sort((a,b)=>(a.b===t?0:1)-(b.b===t?0:1));
 if(!hits.length){box.innerHTML=`<p class="muted">No match for “${qraw}”. Try fewer letters, or check the Word families page.</p>`;return;}
 box.innerHTML=hits.slice(0,40).map(x=>`<div class="fcard"><div><b>${x.word}</b> <span class="muted">${x.meaning}</span> <span class="badge">${x.key}</span></div></div>`).join("");}

function learn(){peek=false;app().innerHTML=`<div class="h2">Learn</div>
 <button class="btn" onclick="tonemarks()">Tone marks (the three tones)</button>
 <button class="btn" onclick="vowel()">Vowel quality (the subdot)</button>
 <button class="btn" onclick="phrasal()">Phrasal combination (tone changes when words join)</button>
 <button class="btn" onclick="sandhi()">Verbs that shift tone</button>
 <button class="btn" onclick="families()">Word families</button>
 <button class="btn soon" disabled>Yorùbá tongue twisters · coming soon</button>
 <button class="btn ghost" onclick="home()">← Home</button>`;}

function tonemarks(){app().innerHTML=`<div class="h2">Tone marks, the three tones</div>
 <div class="lesson">Yorùbá has three tones. Think of them like the notes <b>do, re, mi</b>.
 <ul><li><b>Low (do).</b> Written with a grave mark, like <b>à</b>. Example: <i>ìsàlẹ̀</i>.</li>
 <li><b>Mid (re).</b> No mark at all, like <b>a</b>. The plain, middle voice.</li>
 <li><b>High (mi).</b> Written with an acute mark, like <b>á</b>. Example: <i>òkè</i>.</li></ul>
 Many words are spelled the same but mean different things. The tone mark tells them apart, in writing and in speech.</div>
 <button class="btn ghost" onclick="learn()">← Back to Learn</button>`;}

function vowel(){app().innerHTML=`<div class="h2">Vowel quality, the subdot</div>
 <div class="lesson">Some Yorùbá letters carry a small dot underneath: <b>ẹ, ọ, ṣ</b>. This dot is called the <b>subdot</b>, and it changes the sound the letter makes.
 <ul><li><b>e</b> and <b>ẹ</b> are different sounds. The <b>e</b> is closed, like the <i>ay</i> in <i>day</i>. The <b>ẹ</b> is more open, like the <i>e</i> in <i>bed</i>.</li>
 <li><b>o</b> and <b>ọ</b> differ too. The <b>o</b> is closed, like the <i>o</i> in <i>go</i>. The <b>ọ</b> is more open, like the <i>aw</i> in <i>saw</i>.</li>
 <li><b>s</b> and <b>ṣ</b> differ as well. The <b>ṣ</b> is the <i>sh</i> sound, as in <i>shoe</i>.</li></ul>
 Because the subdot changes the sound, it can change a word’s meaning, just like a tone mark.</div>
 <button class="btn ghost" onclick="learn()">← Back to Learn</button>`;}

function phrasal(){app().innerHTML=`<div class="h2">Phrasal combination</div>
 <div class="lesson"><p>A word does not always keep the tone it has on its own. When two words <b>join</b> in a phrase, the tone of one — or both — can change. So the word you learn in the dictionary may sound a little different once it sits inside a sentence.</p>
 <p><b>The main pattern.</b> A short (one-syllable) <b>verb</b> that carries a <b>low tone</b> on its own often loses that low tone when a <b>noun</b> follows it directly. In the linguistics literature this is described as the verb’s low tone being <i>suppressed before its object</i>.</p>
 <p><b>An example from this game.</b> The word for <i>to know</i> is <b>mọ̀</b> (low) on its own. But in “<i>Ta ló mọ orúkọ...?</i>” it is said as <b>mọ</b> (mid) — the same verb, smoothing its pitch before the noun.</p>
 <p>This is why a form can look identical to another word once its tone shifts. When a question involves such a shift, look for a small gold note under the feedback.</p>
 <p class="muted">Sources: the rule is discussed in works on Yorùbá tonal phonology (the assimilated low tone; tone at the edge of complements). For your write-up, cite <b>Owolabi, Ìjìnlẹ̀ Ítúpẹ̀lẹ̀ Èdè Yorùbá</b> for the exact statement and page.</p></div>
 <button class="btn ghost" onclick="learn()">← Back to Learn</button>`;}

function sandhi(){app().innerHTML=`<div class="h2">Verbs that shift tone</div>
 <div class="lesson">Some short (one-syllable) verbs carry a <b>low tone</b> when they stand alone,
 but that low tone rises to a <b>mid tone</b> when the verb is directly followed by a noun.
 <ul><li><b>Sùn</b> (to sleep) on its own → <b>sun oorun</b> (to sleep deeply).</li>
 <li><b>Nà</b> (to beat) on its own → <b>na Dada</b> (to beat Dada).</li></ul>
 This is not a new word, and the meaning does not change. It is the same verb, smoothing its
 pitch before an object — the same way English “a” becomes “an” before a vowel sound.
 See also <b>Phrasal combination</b> above.</div>
 <button class="btn ghost" onclick="learn()">← Back to Learn</button>`;}

function howto(){app().innerHTML=`<div class="h2">How to play</div>
 <div class="lesson"><ol><li>Pick a level. Start with <b>monosyllabic words</b>, then work up to sentences.</li>
 <li>Read the prompt and pick the word whose tone marks fit the meaning.</li>
 <li>Yorùbá uses three tone marks: low (<b>à</b>), mid (<b>a</b>, no mark), high (<b>á</b>).</li>
 <li>Stuck? Use a <b>Hint</b> to reveal the meanings (${HINTS} per round), or open <b>Word families</b> without losing your place.</li>
 <li>Each correct answer earns points and a coin 🪙. Collect coins to climb the ranks.</li></ol>
 New to tones? Open <b>Learn</b> first.</div>

// ---- startup: load the data, then show the home screen ---------------------
function fail(msg){app().innerHTML=`<div class="h2">Could not load the game</div>
 <div class="lesson">${msg}<br><br>If you opened this file directly, run a small web server instead:
 <br><code>python3 -m http.server</code> then open <code>http://localhost:8000</code>.</div>`;}
async function boot(){
 try{
  const [q,f]=await Promise.all([
   fetch("questions.json").then(r=>{if(!r.ok)throw new Error("questions.json "+r.status);return r.json();}),
   fetch("families.json").then(r=>{if(!r.ok)throw new Error("families.json "+r.status);return r.json();})
  ]);
  QUESTIONS=q;FAMILIES=f;buildData();
  // audio.json is optional: word -> "audio/xxx.mp3". Missing file = no audio, no error.
  try{const a=await fetch("audio.json");if(a.ok)AUDIO=await a.json();}catch(e){}
  home();
 }catch(e){fail(String(e));}
}
boot();
</script></body></html>
